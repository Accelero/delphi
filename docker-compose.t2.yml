x-service-image: &service-image
  image: delphi-service:latest
  build:
    context: .
    dockerfile: Dockerfile.service

services:
  traefik:
    image: traefik:v3.6
    command: ["--configFile=/etc/traefik/traefik.yml"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./ops/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./ops/traefik/dynamic/routes.yml:/etc/traefik/dynamic/routes.yml:ro
    depends_on:
      oauth2-proxy:
        condition: service_started
      api-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
      frontend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    user: root
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "18081"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    ports:
      - "18081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
      - --alpha-config=/etc/oauth2-proxy/alpha.yaml
    restart: unless-stopped
    volumes:
      - ./ops/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./ops/oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  nats:
    image: nats:2
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delphi
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delphi -d delphi"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: delphi
      MINIO_ROOT_PASSWORD: delphi-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8080"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 delphi delphi-secret
        mc mb --ignore-existing local/delphi
        mc anonymous set none local/delphi

  api-service:
    <<: *service-image
    command: ["/usr/local/bin/api-service"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3001
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://delphi:delphi@postgres:5432/delphi
      PG_MAX_CONNECTIONS: "10"
      AUTH_JWKS_URL: http://keycloak:8080/realms/delphi/protocol/openid-connect/certs
      AUTH_EXPECTED_ISSUER: http://localhost:18081/realms/delphi
      AUTH_DEFAULT_TENANT: tenant-a
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
      DELPHI_INGEST_S3_ENDPOINT_INTERNAL: http://minio:9000
      DELPHI_INGEST_S3_ENDPOINT_PUBLIC: http://localhost:9000
      DELPHI_INGEST_S3_REGION: us-east-1
      DELPHI_INGEST_S3_BUCKET: delphi
      DELPHI_INGEST_S3_ACCESS_KEY_ID: delphi
      DELPHI_INGEST_S3_SECRET_ACCESS_KEY: delphi-secret
      DELPHI_INGEST_S3_FORCE_PATH_STYLE: "true"
      INGEST_UPLOAD_PART_SIZE_BYTES: "8388608"
      INGEST_UPLOAD_PART_URL_TTL_SECS: "900"
      INGEST_UPLOAD_CLEANUP_INTERVAL_SECS: "60"
      INGEST_PIPELINE_VERSION: "1"
      UPLOAD_SAGA_TIMEOUT_SECONDS: "86400"
      UPLOAD_CLEANUP_RETRY_SECONDS: "900"
      UPLOAD_SAGA_KV_TTL_SECONDS: "604800"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  realtime-service:
    <<: *service-image
    command: ["/usr/local/bin/realtime-service"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3002
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://delphi:delphi@postgres:5432/delphi
      PG_MAX_CONNECTIONS: "10"
      AUTH_JWKS_URL: http://keycloak:8080/realms/delphi/protocol/openid-connect/certs
      AUTH_EXPECTED_ISSUER: http://localhost:18081/realms/delphi
      AUTH_DEFAULT_TENANT: tenant-a
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
      REALTIME_WS_OUTBOUND_QUEUE_SIZE: "256"
      REALTIME_WS_EVENT_QUEUE_SIZE: "1024"
      REALTIME_CONVERSATION_EVENT_BUFFER_SIZE: "1024"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  chat-worker:
    <<: *service-image
    command: ["/usr/local/bin/chat-worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BIND_ADDR: 0.0.0.0:3003
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://delphi:delphi@postgres:5432/delphi
      PG_MAX_CONNECTIONS: "10"
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
      CHAT_COMMAND_ACK_PROGRESS_SECONDS: "30"
      CHAT_STOP_POLL_SECONDS: "1"
      DELPHI_TITLE_ENABLED: ${DELPHI_TITLE_ENABLED:-true}
      DELPHI_TITLE_PROVIDER: ${DELPHI_TITLE_PROVIDER:-openai-compatible}
      DELPHI_TITLE_BASE_URL: ${DELPHI_TITLE_BASE_URL:-http://title-llm:80/v1}
      DELPHI_TITLE_MODEL: ${DELPHI_TITLE_MODEL:-Qwen2.5-0.5B-Instruct}
      DELPHI_TITLE_API_KEY: ${DELPHI_TITLE_API_KEY:-sk-noauth}
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      title-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  document-worker:
    <<: *service-image
    command: ["/usr/local/bin/document-worker"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3004
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://delphi:delphi@postgres:5432/delphi
      PG_MAX_CONNECTIONS: "10"
      DELPHI_INGEST_S3_ENDPOINT_INTERNAL: http://minio:9000
      DELPHI_INGEST_S3_REGION: us-east-1
      DELPHI_INGEST_S3_BUCKET: delphi
      DELPHI_INGEST_S3_ACCESS_KEY_ID: delphi
      DELPHI_INGEST_S3_SECRET_ACCESS_KEY: delphi-secret
      DELPHI_INGEST_S3_FORCE_PATH_STYLE: "true"
      INGEST_PIPELINE_VERSION: "1"
      DOCUMENT_WORKER_POLL_INTERVAL_SECS: "2"
      UPLOAD_SAGA_KV_TTL_SECONDS: "604800"
      UPLOAD_CLEANUP_RETRY_SECONDS: "900"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3004/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  title-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "80"
      - "--ctx-size"
      - "4096"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - title-llm-models:/models
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    working_dir: /app
    command: ["bun", "run", "dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_SERVER_PORT: "80"
      VITE_HMR_CLIENT_PORT: "8080"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:80/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  keycloak-data:
  nats-data:
  redis-data:
  postgres-data:
  frontend-node-modules:
  title-llm-models:
  minio-data:
