x-service-image: &service-image
  image: delphi-service:latest
  build:
    context: .
    dockerfile: Dockerfile.service

services:
  traefik:
    image: traefik:v3.6
    command: ["--configFile=/etc/traefik/traefik.yml"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./ops/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./ops/traefik/dynamic/routes.yml:/etc/traefik/dynamic/routes.yml:ro
    depends_on:
      oauth2-proxy:
        condition: service_started
      api-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
      frontend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    user: root
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "18081"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    ports:
      - "18081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
      - --alpha-config=/etc/oauth2-proxy/alpha.yaml
    restart: unless-stopped
    volumes:
      - ./ops/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./ops/oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  nats:
    image: nats:2
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  surrealdb:
    image: surrealdb/surrealdb:latest
    user: root
    command: ["start", "--user", "root", "--pass", "root", "rocksdb:/data/surrealdb"]
    ports:
      - "8000:8000"
    volumes:
      - surreal-data:/data

  api-service:
    <<: *service-image
    command: ["/usr/local/bin/api-service"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3001
      NATS_URL: nats://nats:4222
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NAMESPACE: delphi
      SURREAL_DATABASE: delphi
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      SURREAL_BOOTSTRAP_SCHEMA: "true"
      AUTH_JWKS_URL: http://keycloak:8080/realms/delphi/protocol/openid-connect/certs
      AUTH_EXPECTED_ISSUER: http://localhost:18081/realms/delphi
      AUTH_DEFAULT_TENANT: tenant-a
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
    depends_on:
      nats:
        condition: service_started
      surrealdb:
        condition: service_started
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  realtime-service:
    <<: *service-image
    command: ["/usr/local/bin/realtime-service"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3002
      NATS_URL: nats://nats:4222
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NAMESPACE: delphi
      SURREAL_DATABASE: delphi
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      SURREAL_BOOTSTRAP_SCHEMA: "false"
      AUTH_JWKS_URL: http://keycloak:8080/realms/delphi/protocol/openid-connect/certs
      AUTH_EXPECTED_ISSUER: http://localhost:18081/realms/delphi
      AUTH_DEFAULT_TENANT: tenant-a
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
      REALTIME_WS_OUTBOUND_QUEUE_SIZE: "256"
      REALTIME_WS_EVENT_QUEUE_SIZE: "1024"
      REALTIME_CONVERSATION_EVENT_BUFFER_SIZE: "1024"
    depends_on:
      nats:
        condition: service_started
      surrealdb:
        condition: service_started
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  chat-worker:
    <<: *service-image
    command: ["/usr/local/bin/chat-worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BIND_ADDR: 0.0.0.0:3003
      NATS_URL: nats://nats:4222
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NAMESPACE: delphi
      SURREAL_DATABASE: delphi
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      SURREAL_BOOTSTRAP_SCHEMA: "false"
      CHAT_LOCK_TTL_SECONDS: "900"
      CHAT_EVENTS_MAX_AGE_SECONDS: "1800"
      CHAT_REPLAY_TTL_SECONDS: "1500"
      CHAT_COMMAND_ACK_WAIT_SECONDS: "120"
      CHAT_COMMAND_ACK_PROGRESS_SECONDS: "30"
      CHAT_STOP_POLL_SECONDS: "1"
      DELPHI_TITLE_ENABLED: ${DELPHI_TITLE_ENABLED:-true}
      DELPHI_TITLE_PROVIDER: ${DELPHI_TITLE_PROVIDER:-openai-compatible}
      DELPHI_TITLE_BASE_URL: ${DELPHI_TITLE_BASE_URL:-http://title-llm:80/v1}
      DELPHI_TITLE_MODEL: ${DELPHI_TITLE_MODEL:-Qwen2.5-0.5B-Instruct}
      DELPHI_TITLE_API_KEY: ${DELPHI_TITLE_API_KEY:-sk-noauth}
    depends_on:
      nats:
        condition: service_started
      surrealdb:
        condition: service_started
      title-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  title-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "80"
      - "--ctx-size"
      - "4096"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - title-llm-models:/models
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  keycloak-data:
  nats-data:
  redis-data:
  surreal-data:
  title-llm-models:
