[workspace]
members = [
    "crates/auth",
    "crates/config",
    "crates/contracts",
    "crates/llm",
    "crates/nats",
    "crates/storage",
    "services/api-service",
    "services/chat-worker",
    "services/realtime-service",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
http = "1"
rig = { package = "rig-core", version = "0.37", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
uuid = { version = "1", features = ["v4", "serde"] }

delphi-auth = { path = "crates/auth" }
delphi-config = { path = "crates/config" }
delphi-contracts = { path = "crates/contracts" }
delphi-llm = { path = "crates/llm" }
delphi-nats = { path = "crates/nats" }
delphi-storage = { path = "crates/storage" }
