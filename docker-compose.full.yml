name: delphi-full

# Tier 2: full prod-shape dev stack.
#
# Topology:
#   browser → traefik (:80) → frontend (Caddy serving built dist/)
#                           → backend (:8081)        [forward-auth required]
#                           → oauth2-proxy (:4180)   [/oauth2/*]
#   browser → keycloak (:8088)                       [login UI, host-exposed]
#
#   backend                 → surrealdb
#   oauth2-proxy            → keycloak               [token redemption]
#                           → redis                  [session store]
#
# Goal: validate the full prod-shape end-to-end against the same
# primitives a real deployment uses. Backend is built WITHOUT the
# `dev-auth` cargo feature — it cannot self-inject identity, every
# request arrives with an IdP-issued JWT placed there by oauth2-proxy.
# Frontend is the production Caddy bundle (`frontend/Dockerfile`),
# not the Vite dev server, so e2e tests run against the actual bytes
# that ship.
#
# Bring up:   docker compose -f docker-compose.full.yml up -d --build
# Tear down:  docker compose -f docker-compose.full.yml down
# Open:       http://localhost   (login: alice@delphi.test / alice)
#
# This stack is *not* about UI iteration — for that, use the Tier 1 stack
# in docker-compose.yml.

services:
  traefik:
    image: traefik:v3.1
    container_name: delphi-full-traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8089:8080"   # Traefik dashboard (Keycloak owns 8088)
    volumes:
      - ./ops/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./ops/traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - oauth2-proxy
      - backend
      - frontend

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: delphi-full-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # The issuer URL emitted in token claims. Browser must be able to
      # reach this URL; oauth2-proxy reaches the same Keycloak via the
      # docker network using overrides below.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8088"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      # Browser hits Keycloak directly during the OIDC redirect dance
      # at this host port.
      - "8088:8080"

  oauth2-proxy:
    # Pinned to v7.4.0: v7.6 tightened alpha-config to forbid overlap
    # with legacy cfg keys (provider/upstream/server), which forced an
    # all-or-nothing migration that the rest of the stack didn't need.
    # Sticking with v7.4 keeps the legacy-cfg + injectRequestHeaders-only
    # alpha split working.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
    container_name: delphi-full-oauth2-proxy
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
      - --alpha-config=/etc/oauth2-proxy/alpha.yaml
    volumes:
      - ./ops/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./ops/oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    extra_hosts:
      # Lets the in-container `localhost` of the issuer URL resolve to the
      # docker host, so oauth2-proxy can reach Keycloak on the host-exposed
      # port if it falls back to the issuer URL during validation.
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - redis

  redis:
    image: redis:7-alpine
    container_name: delphi-full-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    container_name: delphi-full-surrealdb
    user: "0:0"
    command:
      - start
      - --user=root
      - --pass=root
      - --bind=0.0.0.0:8000
      - --log=info
      # Required so SurrealDB can fetch the IdP's JWKS for RECORD
      # access methods of the `WITH JWT URL '...'` form. Without
      # this the network sandbox blocks the outbound HTTP call and
      # `db.authenticate(jwt)` fails closed with a generic
      # "problem with authentication" error. Comma-separated host:port
      # targets — the Keycloak service inside the compose network.
      - --allow-net=keycloak:8080
      - rocksdb:/data/db
    volumes:
      - surreal_data_full:/data/db
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://0.0.0.0:8000"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        # No `dev-auth` feature — release-shaped binary. The dev-injection
        # middleware is literally not compiled in.
        BACKEND_FEATURES: ""
    image: delphi-backend:full
    container_name: delphi-full-backend
    command: ["serve"]
    environment:
      STORAGE_BACKEND: surreal
      DELPHI_DB_URL: ws://surrealdb:8000/rpc
      # Service-account credentials. Defaults are 'root' for the dev
      # bring-up; production guard refuses these defaults when
      # DELPHI_ENV=production, so a real prod deployment must override.
      DELPHI_DB_USER: ${DELPHI_DB_USER:-root}
      DELPHI_DB_PASSWORD: ${DELPHI_DB_PASSWORD:-root}
      DELPHI_DB_NAMESPACE: delphi
      DELPHI_DB_NAME: main
      # Per-request SurrealDB authentication: the IdP JWT (forwarded
      # by oauth2-proxy as `Authorization: Bearer …`) is validated
      # engine-side against Keycloak's JWKS, then PERMISSIONS clauses
      # on every domain table enforce tenant isolation.
      DELPHI_DB_JWT_MODE: jwks
      DELPHI_DB_JWT_JWKS_URL: ${DELPHI_DB_JWT_JWKS_URL:-http://keycloak:8080/realms/delphi/protocol/openid-connect/certs}
      DELPHI_SOURCES_DEFAULT_TENANT: ${DELPHI_SOURCES_DEFAULT_TENANT:-tenant-a}
      DELPHI_SERVER_BIND_ADDR: 0.0.0.0:8081
      RUST_LOG: info,delphi=debug
      DELPHI_AUTH_MODE: header
      # Default to development for tier-2 dev. Set DELPHI_ENV=production
      # for a real deployment — the runtime guard then refuses to
      # start with default Surreal credentials.
      DELPHI_ENV: ${DELPHI_ENV:-development}
      DELPHI_AUTH_DEFAULT_TENANT: ${DELPHI_AUTH_DEFAULT_TENANT:-tenant-a}
      DELPHI_PROVIDER: ${DELPHI_PROVIDER:-}
      DELPHI_PROVIDER_MODEL: ${DELPHI_PROVIDER_MODEL:-}
      DELPHI_PROVIDER_ANTHROPIC_API_KEY: ${DELPHI_PROVIDER_ANTHROPIC_API_KEY:-}
      DELPHI_PROVIDER_OPENAI_API_KEY: ${DELPHI_PROVIDER_OPENAI_API_KEY:-}
      DELPHI_PROVIDER_GOOGLE_API_KEY: ${DELPHI_PROVIDER_GOOGLE_API_KEY:-}
      DELPHI_PROVIDER_MINIMAX_API_KEY: ${DELPHI_PROVIDER_MINIMAX_API_KEY:-}
      DELPHI_PROVIDER_MINIMAX_BASE_URL: ${DELPHI_PROVIDER_MINIMAX_BASE_URL:-}
      # RAG v1: embedder sidecars.
      DELPHI_EMBEDDER_CHUNK_ENABLED: ${DELPHI_EMBEDDER_CHUNK_ENABLED:-true}
      DELPHI_EMBEDDER_CHUNK_ENDPOINT: ${DELPHI_EMBEDDER_CHUNK_ENDPOINT:-http://tei-chunk:80}
      DELPHI_EMBEDDER_CHUNK_MODEL: ${DELPHI_EMBEDDER_CHUNK_MODEL:-bge-small-en-v1.5}
      DELPHI_EMBEDDER_DOCUMENT_ENABLED: ${DELPHI_EMBEDDER_DOCUMENT_ENABLED:-true}
      DELPHI_EMBEDDER_DOCUMENT_ENDPOINT: ${DELPHI_EMBEDDER_DOCUMENT_ENDPOINT:-http://tei-paper:80}
      DELPHI_EMBEDDER_DOCUMENT_MODEL: ${DELPHI_EMBEDDER_DOCUMENT_MODEL:-specter2}
      # First-turn chat-title generation. Defaults point at the bundled
      # `title-llm` sidecar (local OpenAI-compatible llama.cpp server); the
      # title model has one correct default, so this block ships working
      # defaults rather than failing closed like the chat provider above.
      # DELPHI_TITLE_ENABLED=false reuses the chat model. See
      # docs/architecture/title-llm.md.
      DELPHI_TITLE_ENABLED: ${DELPHI_TITLE_ENABLED:-true}
      DELPHI_TITLE_PROVIDER: ${DELPHI_TITLE_PROVIDER:-openai}
      DELPHI_TITLE_BASE_URL: ${DELPHI_TITLE_BASE_URL:-http://title-llm:80/v1}
      DELPHI_TITLE_MODEL: ${DELPHI_TITLE_MODEL:-Qwen2.5-0.5B-Instruct}
      DELPHI_TITLE_API_KEY: ${DELPHI_TITLE_API_KEY:-sk-noauth}
      # Metadata autofill (ingestion LlmExtractor). Defaults to the chat
      # model; DELPHI_EXTRACT_BASE_URL redirects to an OpenAI-compatible
      # extraction endpoint, DELPHI_EXTRACT_ENABLED=false disables autofill.
      # See docs/architecture/metadata-extractor.md.
      DELPHI_EXTRACT_ENABLED: ${DELPHI_EXTRACT_ENABLED:-true}
      DELPHI_EXTRACT_BASE_URL: ${DELPHI_EXTRACT_BASE_URL:-}
      DELPHI_EXTRACT_MODEL: ${DELPHI_EXTRACT_MODEL:-}
      DELPHI_EXTRACT_API_KEY: ${DELPHI_EXTRACT_API_KEY:-}
      DELPHI_EXTRACT_MAX_INPUT_CHARS: ${DELPHI_EXTRACT_MAX_INPUT_CHARS:-12000}
      DELPHI_EXTRACT_TIMEOUT_SECS: ${DELPHI_EXTRACT_TIMEOUT_SECS:-30}
      # Direct-to-storage object access (ingestion v2 + download). Backend
      # → MinIO over the docker network (INTERNAL); presigned upload/download
      # URLs carry the browser-facing host (PUBLIC = MinIO's published
      # :9000 port). The browser hits MinIO directly — Traefik is no longer
      # in the byte path. See docs/architecture/object-access.md.
      DELPHI_INGEST_OBJECT_STORE_URL: ${DELPHI_INGEST_OBJECT_STORE_URL:-s3://delphi/}
      DELPHI_INGEST_S3_ENDPOINT_INTERNAL: ${DELPHI_INGEST_S3_ENDPOINT_INTERNAL:-http://minio:9000}
      DELPHI_INGEST_S3_ENDPOINT_PUBLIC: ${DELPHI_INGEST_S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      DELPHI_INGEST_S3_REGION: ${DELPHI_INGEST_S3_REGION:-us-east-1}
      DELPHI_INGEST_S3_BUCKET: ${DELPHI_INGEST_S3_BUCKET:-delphi}
      DELPHI_INGEST_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-delphi}
      DELPHI_INGEST_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
      DELPHI_INGEST_S3_FORCE_PATH_STYLE: ${DELPHI_INGEST_S3_FORCE_PATH_STYLE:-true}
    depends_on:
      surrealdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      tei-chunk:
        condition: service_started
      tei-paper:
        condition: service_started
      title-llm:
        condition: service_started

  # MinIO: S3-compatible object store for direct-to-storage object access.
  # Published on :9000 (S3 API) + :9001 (console) so the browser PUTs
  # upload parts and GETs downloads directly via presigned URLs; the
  # backend reaches it over the docker network at minio:9000. No Traefik
  # in the byte path. See docs/architecture/object-access.md.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: delphi-full-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delphi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
    volumes:
      - minio_data_full:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: delphi-full-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delphi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
    # No CORS step: MinIO's built-in default echoes the Origin, allows PUT,
    # and exposes ETag; the per-bucket `mc cors set` S3 API isn't
    # implemented by MinIO. Restrict origins in prod via the server-level
    # `MINIO_API_CORS_ALLOW_ORIGIN` env on the minio service.
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/delphi &&
             mc anonymous set none local/delphi"

  # RAG v1: TEI sidecars. Same images / model IDs as tier 1.
  tei-chunk:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: delphi-full-tei-chunk
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_chunk_data_full:/data

  tei-paper:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: delphi-full-tei-paper
    command: ["--model-id", "allenai/specter2_base"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_paper_data_full:/data

  # Title-generation sidecar (see docs/architecture/title-llm.md). Same as
  # Tier 1 but internal-only — no published port, matching how Tier 2 hides
  # the TEI containers behind the docker network.
  title-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: delphi-full-title-llm
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "80"
      - "--ctx-size"
      - "4096"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - title_llm_models_full:/models

  # Prod-shape frontend: production bundle baked into a Caddy image,
  # not the Vite dev server. Tier-2 is meant to mirror prod end-to-end;
  # serving HMR'd dev sources here would defeat the purpose. Tier-1
  # (`docker-compose.yml`) keeps Vite for the inner-loop dev workflow.
  #
  # `build:` block lets `make full-up` build the image locally on first
  # run; CI overrides with the GHCR image (`ghcr.io/.../delphi-frontend:<sha>`)
  # so e2e validates the exact bytes that ship.
  frontend:
    image: delphi-frontend:tier2
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delphi-full-frontend

volumes:
  surreal_data_full:
  minio_data_full:
  tei_chunk_data_full:
  tei_paper_data_full:
  title_llm_models_full:
