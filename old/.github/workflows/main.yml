# Main-CI — runs after a squash-merge lands on `main`.
#
# Single job: build the backend container and push to GHCR. Tagged with
# the commit SHA (immutable, what to deploy) and `latest` (convenience
# pointer). Test re-run is intentionally omitted — PR-CI already
# validated the diff, and we don't have concurrent merges yet to
# justify the extra cycle. Add a re-run job here if/when the team
# grows past 2-3 active PRs at a time, or adopt GitHub Merge Queue.

name: main

on:
  push:
    branches: [main]

# Don't cancel main-branch builds — each merged commit gets its own
# image. Last-write-wins on tags is fine for `latest` but every SHA
# tag must exist for rollback.
concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }} image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            cache_scope: backend
            # Production-shaped: NO dev-auth feature.
            build_args: BACKEND_FEATURES=
          - image: frontend
            context: ./frontend
            cache_scope: frontend
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker tags must be all-lowercase; GitHub repo owners often
      # aren't (e.g. `Accelero`). Project expressions have no `lower()`
      # builtin, so compute it here.
      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/delphi-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/delphi-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          build-args: ${{ matrix.build_args }}
