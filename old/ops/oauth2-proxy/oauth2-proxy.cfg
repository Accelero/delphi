# oauth2-proxy legacy cfg — non-alpha-covered options only.
#
# Provider / upstream / server / header config lives in alpha.yaml.
# When --alpha-config is used, alpha owns those blocks and refuses
# them here.

# Browser-visible URL Keycloak redirects back to after login. Traefik
# routes `/oauth2/*` → this proxy.
redirect_url = "http://localhost/oauth2/callback"

# 32-character cookie secret. *** dev-only — regenerate for any
# non-local deployment with: head -c 24 /dev/urandom | base64 ***
cookie_secret = "0123456789abcdef0123456789abcdef"
cookie_secure = false
cookie_samesite = "lax"
# Cookie TTL ≤ access-token TTL so the structural relationship documented
# in docs/architecture/multitenancy.md holds.
cookie_expire = "25m"
cookie_refresh = "20m"

# Accept any verified email (Keycloak emits dev users in any domain).
email_domains = ["*"]
# `localhost:8088` is whitelisted so the Traefik signout-chain
# middleware can hand us a Keycloak end-session URL as `rd`.
# Without it oauth2-proxy refuses the redirect as open-redirect risk.
whitelist_domains = ["localhost", "localhost:80", "localhost:8088"]

reverse_proxy = true

# Skip the in-house provider-selection button — go straight to Keycloak.
# Cleaner UX and predictable for Playwright e2e.
skip_provider_button = true

# Sessions live in Redis so they survive proxy restarts (and so we have
# a place to wire instant blacklist invalidation later).
session_store_type = "redis"
redis_connection_url = "redis://redis:6379"
