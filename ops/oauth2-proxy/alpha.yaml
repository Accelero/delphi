server:
  BindAddress: 0.0.0.0:4180

providers:
  - id: keycloak-dev
    name: "Keycloak (dev)"
    provider: oidc
    clientID: delphi
    clientSecret: change-me
    loginURL: http://localhost:18081/realms/delphi/protocol/openid-connect/auth
    redeemURL: http://keycloak:8080/realms/delphi/protocol/openid-connect/token
    profileURL: http://keycloak:8080/realms/delphi/protocol/openid-connect/userinfo
    oidcConfig:
      issuerURL: http://localhost:18081/realms/delphi
      skipDiscovery: true
      jwksURL: http://keycloak:8080/realms/delphi/protocol/openid-connect/certs
      emailClaim: email
      userIDClaim: email
      audienceClaims: [aud]
      insecureSkipNonce: true

upstreamConfig:
  upstreams:
    - id: static
      path: /
      static: true
      staticCode: 202

injectResponseHeaders:
  - name: Authorization
    values:
      - claim: access_token
        prefix: "Bearer "
