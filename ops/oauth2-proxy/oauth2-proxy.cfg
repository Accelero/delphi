# oauth2-proxy configuration for the Tier 2 (full prod-shape) dev stack.
#
# Role in the stack:
#   - Browser ↔ Traefik: the only thing the browser sees.
#   - Traefik forward-auth ↔ oauth2-proxy: per-request "is this user logged
#     in?" check. oauth2-proxy responds with verified-claim headers that
#     Traefik passes through to the backend.
#   - oauth2-proxy ↔ Dex: OIDC dance. oauth2-proxy is the only consumer of
#     the JWT — the backend never sees it.
#
# The two URL realms are tricky in dev: the browser sees host-side URLs
# (`http://localhost:5556/...`), oauth2-proxy talks to Dex over the docker
# network (`http://dex:5556/...`). We resolve this by setting Dex's `issuer`
# to the host URL (so the JWT `iss` claim is host-visible) and overriding
# oauth2-proxy's `--redeem-url`/`--oidc-jwks-url` to the internal URL.

provider = "oidc"
provider_display_name = "Dex (dev)"

# Skip OIDC discovery — the issuer URL is host-side and not reachable from
# inside the container. We supply each endpoint explicitly below.
oidc_issuer_url = "http://localhost:5556/dex"
skip_oidc_discovery = true
login_url    = "http://localhost:5556/dex/auth"
redeem_url   = "http://dex:5556/dex/token"
oidc_jwks_url = "http://dex:5556/dex/keys"

client_id     = "delphi-dev"
client_secret = "dex-app-secret-please-change"

# Browser-visible URL Dex redirects back to after login. Traefik routes
# `/oauth2/*` → this proxy.
redirect_url = "http://localhost/oauth2/callback"

# 32-byte base64 cookie key. *** dev-only secret — regenerate for any
# non-local deployment with: openssl rand -base64 32 ***
cookie_secret = "Y29va2llLWtleS1kZXYtMzItYnl0ZS1zZWNyZXQ="
cookie_secure = false
cookie_samesite = "lax"

# Accept any verified email (Dex emits dev users in any domain).
email_domains = ["*"]

# Forward-auth mode: oauth2-proxy proxies nothing of its own; Traefik calls
# `/oauth2/auth` per request. `static://202` keeps oauth2-proxy happy without
# a real upstream.
upstream = ["static://202"]

http_address = "0.0.0.0:4180"
reverse_proxy = true
whitelist_domains = ["localhost", "localhost:80"]

# Sessions live in Redis so they survive proxy restarts (and so we have a
# place to wire instant blacklist invalidation later).
session_store_type = "redis"
redis_connection_url = "redis://redis:6379"

# Standard X-Auth-Request-* headers (used as a backstop / debug aid). The
# real header injection — emitting the canonical `X-Auth-*` names the
# backend reads — happens in alpha-config.yaml.
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
