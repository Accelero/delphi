# nats-server has no CLI flag for max_payload, so the whole server config lives
# here rather than being split between `command:` and a file.

# The parts list dominates an `UploadCompleted` work item: 10 000 parts at
# ~55 bytes each is roughly 550 KB, and the metadata patch adds up to 32 KB on
# top. The 1 MB default leaves no margin. `/complete` refuses anything over
# DELPHI_DOCUMENT_MAX_COMMAND_BYTES (7 MiB) before publishing, so this ceiling
# is never the thing a user hits.
max_payload: 8MB

http_port: 8222

jetstream {
  store_dir: "/data"
}
