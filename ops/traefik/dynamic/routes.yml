http:
  routers:
    api:
      rule: PathPrefix(`/api`)
      service: api-service
      entryPoints: [web]
      middlewares: [auth]
    ws:
      rule: PathPrefix(`/ws`)
      service: realtime-service
      entryPoints: [web]
      middlewares: [auth]
    oauth:
      rule: PathPrefix(`/oauth2`)
      service: oauth2-proxy
      entryPoints: [web]
    app:
      rule: PathPrefix(`/`)
      service: frontend
      entryPoints: [web]

  middlewares:
    auth:
      forwardAuth:
        address: http://oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - Authorization

  services:
    api-service:
      loadBalancer:
        servers:
          - url: http://api-service:3001
    realtime-service:
      loadBalancer:
        servers:
          - url: http://realtime-service:3002
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:80
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: http://oauth2-proxy:4180
