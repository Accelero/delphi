# Dynamic Traefik configuration: routers, services, middlewares.
#
# Routing summary:
#   /oauth2/*  → oauth2-proxy directly (no auth gate; this *is* the gate).
#   /api/*     → backend, gated by `oauth2-forward-auth` middleware.
#   /healthz   → backend, public.
#   /          → frontend SPA.
#
# The frontend itself is served anonymously. The SPA's first call to
# /api/auth/me trips the forward-auth gate; oauth2-proxy returns 401 →
# Traefik 302s the browser to /oauth2/sign_in → Keycloak login →
# callback → cookie set → SPA reload sees the user logged in.

http:
  routers:
    # Stable, IdP-agnostic logout URL the SPA navigates to. We rewrite
    # it here (not in the SPA) so the Keycloak end-session URL — the
    # one piece of deployment-specific knowledge — stays at the edge.
    # The middleware below 302s to /oauth2/sign_out with a Keycloak
    # RP-initiated-logout URL as `rd`, so oauth2-proxy clears the BFF
    # session, then forwards the browser to Keycloak's end-session
    # endpoint, which kills the SSO session and bounces back to "/".
    # Without that second hop, the SPA's next /api call would silently
    # re-authenticate against the still-valid Keycloak SSO session and
    # logout would look like a no-op.
    signout:
      rule: "Path(`/signout`)"
      service: oauth2-proxy   # never reached — middleware redirects first
      entryPoints: [web]
      middlewares:
        - signout-chain

    oauth2-proxy:
      rule: "PathPrefix(`/oauth2/`)"
      service: oauth2-proxy
      entryPoints: [web]

    backend-public:
      rule: "Path(`/healthz`)"
      service: backend
      entryPoints: [web]

    backend-api:
      rule: "PathPrefix(`/api/`)"
      service: backend
      entryPoints: [web]
      middlewares:
        - oauth2-forward-auth

    frontend:
      rule: "PathPrefix(`/`)"
      service: frontend
      entryPoints: [web]
      priority: 1   # lowest — only matches when nothing more specific did

  services:
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8081"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:5173"

  middlewares:
    # Forward-auth: every /api/* request triggers a sub-request to
    # oauth2-proxy's /oauth2/auth endpoint. On 2xx we forward the listed
    # response headers onto the original request (so the backend sees
    # `X-Auth-*`). On 401 oauth2-proxy emits a redirect to /oauth2/sign_in
    # and Traefik propagates it to the browser.
    oauth2-forward-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        # Single header: Authorization: Bearer <IdP-issued JWT>. The
        # backend's `JwtClaimsExtractor` decodes the payload for all
        # identity claims. See docs/architecture/multitenancy.md for
        # the trust model.
        authResponseHeaders:
          - Authorization

    # SPA navigates to /signout (stable, IdP-agnostic). This 302s the
    # browser to /oauth2/sign_out with a Keycloak end-session URL as
    # `rd`. The browser then visits:
    #   1. oauth2-proxy → clears _oauth2_proxy cookie + Redis session,
    #      302 to rd (Keycloak end-session endpoint).
    #   2. Keycloak     → kills SSO session, drops KEYCLOAK_SESSION
    #      cookies, 302 to post_logout_redirect_uri (= http://localhost/).
    #   3. SPA boots clean; next /api call triggers a real Keycloak
    #      login form, not a silent re-auth.
    # oauth2-proxy's whitelist_domains must include `localhost:8088`
    # or it refuses the `rd` value as an open-redirect risk.
    signout-chain:
      redirectRegex:
        regex: "^http://([^/]+)/signout/?$"
        replacement: "http://${1}/oauth2/sign_out?rd=http%3A%2F%2Flocalhost%3A8088%2Frealms%2Fdelphi%2Fprotocol%2Fopenid-connect%2Flogout%3Fpost_logout_redirect_uri%3Dhttp%253A%252F%252Flocalhost%252F%26client_id%3Ddelphi-dev"
        permanent: false
