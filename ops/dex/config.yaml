# Dex IdP configuration for the Tier 2 (full prod-shape) dev stack.
#
# `issuer` is the URL that goes into the `iss` claim of every ID token AND
# is what oauth2-proxy validates the token against. It must be reachable by
# both the browser (for login UI) and oauth2-proxy (for token redemption /
# JWKS). We pick a host-side URL (localhost:5556) that:
#   - the browser can hit directly (Dex listens on this port via compose
#     port-mapping);
#   - oauth2-proxy can also hit through `extra_hosts: host.docker.internal`
#     in the compose file (or, equivalently, via `--login-url` / `--redeem-url`
#     overrides — see ops/oauth2-proxy/oauth2-proxy.cfg).
#
# Production swap: replace this entire file with config pointing at your
# real IdP (WorkOS, Auth0, Zitadel, Okta, …). Nothing else in the stack
# needs to change — the contract is OIDC.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Skip the consent screen for dev convenience.
  skipApprovalScreen: true

# Single static client: oauth2-proxy. Secret only used inside the dev stack;
# never reuse outside dev.
staticClients:
  - id: delphi-dev
    name: 'Delphi Dev'
    secret: dex-app-secret-please-change
    redirectURIs:
      - 'http://localhost/oauth2/callback'

enablePasswordDB: true

# One static user. Multi-tenant testing in this stack is *not* the goal —
# the goal is end-to-end auth integration. To exercise the tenant claim
# end-to-end, swap Dex out for an IdP that emits a `groups` claim per
# user (or use a Dex connector that does).
#
# Login: alice@delphi.test  /  password: alice
staticPasswords:
  - email: "alice@delphi.test"
    # bcrypt of "alice"
    hash: "$2y$10$Bd1F1IXl1n.Z6pVOUbkQSeYL3JStxg7lBVCQvyBEr6ApF98WfgRGC"
    username: "alice"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
