name: delphi

# Tier 1: fast inner-loop dev stack.
#
#   surrealdb + backend (with dev-auth) + frontend (Vite HMR)
#
# The backend's `dev-auth` cargo feature compiles in a tiny middleware that
# writes a fixed set of `X-Auth-*` headers onto every request — the same
# headers the production proxy stack would emit. The downstream identity
# middleware, claim extractor, and user upsert all run unchanged. This is
# the "dev switch substitutes for the BFF" guarantee: same code path,
# different header source.
#
# For the full prod-shape stack (Traefik + Dex + oauth2-proxy + Redis),
# see docker-compose.full.yml.

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    container_name: delphi-surrealdb
    user: "0:0"
    command:
      - start
      - --user=root
      - --pass=root
      - --bind=0.0.0.0:8000
      - --log=info
      - rocksdb:/data/db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data/db
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://0.0.0.0:8000"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        # Compose default = `dev-auth` so local dev mounts the bypass.
        # CI/prod builds set BACKEND_FEATURES="" (or omit env) to compile
        # WITHOUT the dev-auth feature → release binaries don't contain
        # the bypass code.
        BACKEND_FEATURES: ${BACKEND_FEATURES-dev-auth}
    image: delphi-backend:dev
    container_name: delphi-backend
    command: ["serve"]
    environment:
      STORAGE_BACKEND: surreal
      SURREAL_URL: ws://surrealdb:8000/rpc
      # Service-account credentials for the backend's privileged DB
      # connection (boot, admin, scheduler). Production guard refuses to
      # start with these defaults when RUST_ENV=production.
      SURREAL_SERVICE_USER: ${SURREAL_SERVICE_USER:-root}
      SURREAL_SERVICE_PASS: ${SURREAL_SERVICE_PASS:-root}
      SURREAL_NS: delphi
      SURREAL_DB: main
      # Tier 1: SurrealDB validates the dev JWT with an HS512 shared
      # secret. The (currently-broken, audit finding N1) dev injector
      # will sign with the same secret once it is restored.
      SURREAL_JWT_MODE: hs512
      SURREAL_JWT_SECRET: ${SURREAL_JWT_SECRET:-tier1-dev-jwt-secret-not-for-production}
      # Tenant the scheduler-driven adapters write to (single-tenant v1).
      SOURCES_DEFAULT_TENANT_SLUG: ${SOURCES_DEFAULT_TENANT_SLUG:-dev}
      BIND_ADDR: 0.0.0.0:8081
      RUST_LOG: info,delphi=debug
      # Auth — `dev` injects `X-Auth-*` headers internally; `header` requires
      # an upstream proxy (use docker-compose.full.yml for that).
      AUTH_MODE: ${AUTH_MODE:-dev}
      RUST_ENV: ${RUST_ENV:-development}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-dev}
      # Dev — only honored if compiled with the `dev-auth` cargo feature
      DEV_TENANT_SLUG: ${DEV_TENANT_SLUG:-dev}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@delphi.local}
      DEV_USER_NAME: ${DEV_USER_NAME:-Dev User}
      # LLM (read at startup by rig via env)
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      # Source adapters (Discovery pillar). All optional; SOURCES_ENABLED
      # gates the scheduler entirely. ARXIV_QUERY gates the arXiv
      # adapter individually — unset = adapter not registered.
      SOURCES_ENABLED: ${SOURCES_ENABLED:-false}
      ARXIV_QUERY: ${ARXIV_QUERY:-}
      ARXIV_POLL_INTERVAL_SECS: ${ARXIV_POLL_INTERVAL_SECS:-21600}
      ARXIV_PAGE_SIZE: ${ARXIV_PAGE_SIZE:-50}
      # arXiv asks for a contact email in the User-Agent so they can
      # reach out before rate-limiting an offending client. Optional
      # but reduces 429 risk.
      ARXIV_CONTACT_EMAIL: ${ARXIV_CONTACT_EMAIL:-}
      # Object storage for original artefacts (PDFs etc.). Path is the
      # *container* path; the volume mount below maps it to the host.
      OBJECT_STORE_URL: ${OBJECT_STORE_URL:-file:///var/lib/delphi/originals}
      # RAG v1: embedder sidecars (tei-chunk + tei-paper). The backend
      # tolerates absent / disabled embedders — RAG is a pillar, not a
      # boot-critical dep — but the defaults wire it up.
      EMBEDDER_CHUNK_ENABLED: ${EMBEDDER_CHUNK_ENABLED:-true}
      EMBEDDER_CHUNK_ENDPOINT: ${EMBEDDER_CHUNK_ENDPOINT:-http://tei-chunk:80}
      EMBEDDER_CHUNK_MODEL_NAME: ${EMBEDDER_CHUNK_MODEL_NAME:-bge-small-en-v1.5}
      EMBEDDER_DOCUMENT_ENABLED: ${EMBEDDER_DOCUMENT_ENABLED:-true}
      EMBEDDER_DOCUMENT_ENDPOINT: ${EMBEDDER_DOCUMENT_ENDPOINT:-http://tei-paper:80}
      EMBEDDER_DOCUMENT_MODEL_NAME: ${EMBEDDER_DOCUMENT_MODEL_NAME:-specter2}
    volumes:
      - ./data/originals:/var/lib/delphi/originals
    ports:
      - "8081:8081"
    depends_on:
      surrealdb:
        condition: service_healthy
      tei-chunk:
        condition: service_started
      tei-paper:
        condition: service_started

  # Hugging Face Text Embeddings Inference (chunk-class — BGE-small).
  # Model weights are cached on a named volume so dev restarts are fast.
  # First boot downloads weights to the volume (slow); subsequent boots
  # are near-instant.
  tei-chunk:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: delphi-tei-chunk
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_chunk_data:/data
    ports:
      # Tier 1 exposes the chunk TEI for curl debugging; tier 2 doesn't.
      - "8082:80"

  # TEI (document-class — SPECTER2). Same shape as tei-chunk.
  tei-paper:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: delphi-tei-paper
    command: ["--model-id", "allenai/specter2_base"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_paper_data:/data
    ports:
      - "8083:80"

  # Vite dev server with HMR. Mounts ./frontend so edits are live.
  frontend:
    image: oven/bun:1.1
    container_name: delphi-frontend
    working_dir: /app
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then bun install; fi; exec bun run dev"]
    environment:
      BACKEND_URL: http://backend:8081
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  surreal_data:
  frontend_node_modules:
  tei_chunk_data:
  tei_paper_data:
