name: delphi

# Tier 1: fast inner-loop dev stack.
#
#   surrealdb + backend (with dev-auth) + frontend (Vite HMR)
#
# The backend's `dev-auth` cargo feature compiles in a tiny middleware that
# writes a fixed set of `X-Auth-*` headers onto every request — the same
# headers the production proxy stack would emit. The downstream identity
# middleware, claim extractor, and user upsert all run unchanged. This is
# the "dev switch substitutes for the BFF" guarantee: same code path,
# different header source.
#
# For the full prod-shape stack (Traefik + Dex + oauth2-proxy + Redis),
# see docker-compose.full.yml.

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    container_name: delphi-surrealdb
    user: "0:0"
    command:
      - start
      - --user=root
      - --pass=root
      - --bind=0.0.0.0:8000
      - --log=info
      - rocksdb:/data/db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data/db
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://0.0.0.0:8000"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        # Compose default = `dev-auth` so local dev mounts the bypass.
        # CI/prod builds set BACKEND_FEATURES="" (or omit env) to compile
        # WITHOUT the dev-auth feature → release binaries don't contain
        # the bypass code.
        BACKEND_FEATURES: ${BACKEND_FEATURES-dev-auth}
    image: delphi-backend:dev
    container_name: delphi-backend
    command: ["serve"]
    environment:
      STORAGE_BACKEND: surreal
      DELPHI_DB_URL: ws://surrealdb:8000/rpc
      # Service-account credentials for the backend's privileged DB
      # connection (boot, admin, scheduler). Production guard refuses to
      # start with these defaults when DELPHI_ENV=production.
      DELPHI_DB_USER: ${DELPHI_DB_USER:-root}
      DELPHI_DB_PASSWORD: ${DELPHI_DB_PASSWORD:-root}
      DELPHI_DB_NAMESPACE: delphi
      DELPHI_DB_NAME: main
      # Tier 1: SurrealDB validates the dev JWT with an HS512 shared
      # secret. The (currently-broken, audit finding N1) dev injector
      # will sign with the same secret once it is restored.
      DELPHI_DB_JWT_MODE: hs512
      DELPHI_DB_JWT_SECRET: ${DELPHI_DB_JWT_SECRET:-tier1-dev-jwt-secret-not-for-production}
      # Tenant the scheduler-driven adapters write to (single-tenant v1).
      DELPHI_SOURCES_DEFAULT_TENANT: ${DELPHI_SOURCES_DEFAULT_TENANT:-dev}
      DELPHI_SERVER_BIND_ADDR: 0.0.0.0:8081
      RUST_LOG: info,delphi=debug
      # Auth — `dev` injects `X-Auth-*` headers internally; `header` requires
      # an upstream proxy (use docker-compose.full.yml for that).
      DELPHI_AUTH_MODE: ${DELPHI_AUTH_MODE:-dev}
      DELPHI_ENV: ${DELPHI_ENV:-development}
      DELPHI_AUTH_DEFAULT_TENANT: ${DELPHI_AUTH_DEFAULT_TENANT:-dev}
      # Dev — only honored if compiled with the `dev-auth` cargo feature
      DELPHI_AUTH_DEV_TENANT: ${DELPHI_AUTH_DEV_TENANT:-dev}
      DELPHI_AUTH_DEV_USER_EMAIL: ${DELPHI_AUTH_DEV_USER_EMAIL:-dev@delphi.local}
      DELPHI_AUTH_DEV_USER_NAME: ${DELPHI_AUTH_DEV_USER_NAME:-Dev User}
      # LLM (read at startup by rig via env)
      DELPHI_PROVIDER: ${DELPHI_PROVIDER:-}
      DELPHI_PROVIDER_MODEL: ${DELPHI_PROVIDER_MODEL:-}
      DELPHI_PROVIDER_ANTHROPIC_API_KEY: ${DELPHI_PROVIDER_ANTHROPIC_API_KEY:-}
      DELPHI_PROVIDER_OPENAI_API_KEY: ${DELPHI_PROVIDER_OPENAI_API_KEY:-}
      DELPHI_PROVIDER_MINIMAX_API_KEY: ${DELPHI_PROVIDER_MINIMAX_API_KEY:-}
      DELPHI_PROVIDER_MINIMAX_BASE_URL: ${DELPHI_PROVIDER_MINIMAX_BASE_URL:-}
      DELPHI_PROVIDER_GOOGLE_API_KEY: ${DELPHI_PROVIDER_GOOGLE_API_KEY:-}
      # Source adapters (Discovery pillar). All optional; DELPHI_SOURCES_ENABLED
      # gates the scheduler entirely. No in-tree adapters today.
      DELPHI_SOURCES_ENABLED: ${DELPHI_SOURCES_ENABLED:-false}
      # Object storage for original artefacts (PDFs etc.). Direct-to-S3
      # via MinIO (ingestion v2). The bucket from the URL is informational;
      # the connection knobs come from INGEST_S3_* below.
      DELPHI_INGEST_OBJECT_STORE_URL: ${DELPHI_INGEST_OBJECT_STORE_URL:-s3://delphi/}
      # Backend → MinIO (internal docker network host).
      DELPHI_INGEST_S3_ENDPOINT_INTERNAL: ${DELPHI_INGEST_S3_ENDPOINT_INTERNAL:-http://minio:9000}
      # Embedded in presigned URLs the browser PUTs to directly. Tier-1
      # exposes MinIO on :9000 to the host, same origin policy permitting
      # via CORS (allows the Vite :5173 origin).
      DELPHI_INGEST_S3_ENDPOINT_PUBLIC: ${DELPHI_INGEST_S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      DELPHI_INGEST_S3_REGION: ${DELPHI_INGEST_S3_REGION:-us-east-1}
      DELPHI_INGEST_S3_BUCKET: ${DELPHI_INGEST_S3_BUCKET:-delphi}
      DELPHI_INGEST_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-delphi}
      DELPHI_INGEST_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
      DELPHI_INGEST_S3_FORCE_PATH_STYLE: ${DELPHI_INGEST_S3_FORCE_PATH_STYLE:-true}
      # RAG v1: embedder sidecars (tei-chunk + tei-paper). The backend
      # tolerates absent / disabled embedders — RAG is a pillar, not a
      # boot-critical dep — but the defaults wire it up.
      DELPHI_EMBEDDER_CHUNK_ENABLED: ${DELPHI_EMBEDDER_CHUNK_ENABLED:-true}
      DELPHI_EMBEDDER_CHUNK_ENDPOINT: ${DELPHI_EMBEDDER_CHUNK_ENDPOINT:-http://tei-chunk:80}
      DELPHI_EMBEDDER_CHUNK_MODEL: ${DELPHI_EMBEDDER_CHUNK_MODEL:-bge-small-en-v1.5}
      DELPHI_EMBEDDER_DOCUMENT_ENABLED: ${DELPHI_EMBEDDER_DOCUMENT_ENABLED:-true}
      DELPHI_EMBEDDER_DOCUMENT_ENDPOINT: ${DELPHI_EMBEDDER_DOCUMENT_ENDPOINT:-http://tei-paper:80}
      DELPHI_EMBEDDER_DOCUMENT_MODEL: ${DELPHI_EMBEDDER_DOCUMENT_MODEL:-specter2}
      # First-turn chat-title generation. Unlike the chat provider above,
      # this block ships working defaults pointing at the bundled `title-llm`
      # sidecar (a local OpenAI-compatible llama.cpp server) — the title
      # model has one correct default, so the feature is "default to the
      # sidecar." Set DELPHI_TITLE_ENABLED=false to reuse the chat model
      # instead (e.g. for a leaner dev loop). See docs/architecture/title-llm.md.
      DELPHI_TITLE_ENABLED: ${DELPHI_TITLE_ENABLED:-true}
      DELPHI_TITLE_PROVIDER: ${DELPHI_TITLE_PROVIDER:-openai}
      DELPHI_TITLE_BASE_URL: ${DELPHI_TITLE_BASE_URL:-http://title-llm:80/v1}
      DELPHI_TITLE_MODEL: ${DELPHI_TITLE_MODEL:-Qwen2.5-0.5B-Instruct}
      DELPHI_TITLE_API_KEY: ${DELPHI_TITLE_API_KEY:-sk-noauth}
      # Metadata autofill (ingestion LlmExtractor). Defaults to the chat
      # model above (no sidecar needed) — extraction runs once per upload, so
      # the capable chat model is the right tool. Set DELPHI_EXTRACT_BASE_URL
      # to redirect to an OpenAI-compatible extraction endpoint (a 3B–7B
      # local sidecar for offline use, or a different cloud model);
      # DELPHI_EXTRACT_ENABLED=false disables autofill (prefill-only). See
      # docs/architecture/metadata-extractor.md.
      DELPHI_EXTRACT_ENABLED: ${DELPHI_EXTRACT_ENABLED:-true}
      DELPHI_EXTRACT_BASE_URL: ${DELPHI_EXTRACT_BASE_URL:-}
      DELPHI_EXTRACT_MODEL: ${DELPHI_EXTRACT_MODEL:-}
      DELPHI_EXTRACT_API_KEY: ${DELPHI_EXTRACT_API_KEY:-}
      DELPHI_EXTRACT_MAX_INPUT_CHARS: ${DELPHI_EXTRACT_MAX_INPUT_CHARS:-12000}
      DELPHI_EXTRACT_TIMEOUT_SECS: ${DELPHI_EXTRACT_TIMEOUT_SECS:-30}
    ports:
      - "8081:8081"
    depends_on:
      surrealdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      tei-chunk:
        condition: service_started
      tei-paper:
        condition: service_started
      title-llm:
        condition: service_started

  # MinIO: S3-compatible object store for direct-to-S3 ingestion uploads.
  # Tier-1 exposes :9000 (S3 API) + :9001 (console) to the host so the
  # browser PUTs parts directly via presigned URLs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: delphi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delphi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: create the bucket and lock down anonymous access.
  # CORS is NOT configured here: MinIO's built-in default already echoes
  # the request Origin, allows PUT, and exposes `ETag` (which Uppy needs
  # to read each part's etag) — and MinIO doesn't implement the per-bucket
  # `mc cors set` S3 API anyway. For prod you'd restrict origins via the
  # server-level `MINIO_API_CORS_ALLOW_ORIGIN` env on the minio service.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: delphi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delphi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delphi-minio-dev-secret-please-change}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/delphi &&
             mc anonymous set none local/delphi"

  # Hugging Face Text Embeddings Inference (chunk-class — BGE-small).
  # Model weights are cached on a named volume so dev restarts are fast.
  # First boot downloads weights to the volume (slow); subsequent boots
  # are near-instant.
  tei-chunk:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: delphi-tei-chunk
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_chunk_data:/data
    ports:
      # Tier 1 exposes the chunk TEI for curl debugging; tier 2 doesn't.
      - "8082:80"

  # TEI (document-class — SPECTER2). Same shape as tei-chunk.
  tei-paper:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: delphi-tei-paper
    command: ["--model-id", "allenai/specter2_base"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_paper_data:/data
    ports:
      - "8083:80"

  # Title-generation sidecar: a small CPU LLM behind an OpenAI-compatible
  # `/v1` API (llama.cpp server). `-hf` auto-downloads the GGUF on first
  # boot into the model-cache volume — same shape as the TEI embedders.
  # The backend titles chats against this instead of the chat model
  # (data-locality + decoupling; see docs/architecture/title-llm.md).
  title-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: delphi-title-llm
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "80"
      - "--ctx-size"
      - "4096"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - title_llm_models:/models
    ports:
      # Tier 1 exposes the sidecar for curl debugging; tier 2 doesn't.
      - "8084:80"

  # Vite dev server with HMR. Mounts ./frontend so edits are live.
  frontend:
    image: oven/bun:1.3
    container_name: delphi-frontend
    working_dir: /app
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then bun install; fi; exec bun run dev"]
    environment:
      BACKEND_URL: http://backend:8081
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  surreal_data:
  minio_data:
  frontend_node_modules:
  tei_chunk_data:
  tei_paper_data:
  title_llm_models:
