[package]
name = "delphi"
version = "0.0.1"
edition = "2021"
description = "Delphi: research-tool backend (axum + storage + agents)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "delphi"
path = "src/main.rs"

[dependencies]
# storage
surrealdb = { version = "2", default-features = false, features = ["protocol-ws", "protocol-http", "rustls"] }

# http server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
async-trait = "0.1"
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# errors
thiserror = "1"
anyhow = "1"

# LLM agent framework (provider-agnostic)
rig-core = { version = "0.35", features = ["all"] }

# auth (BFF: backend owns OIDC tokens; browser sees only HTTP-only session cookie)
axum-oidc       = "0.6"
tower-sessions  = { version = "0.14", default-features = false, features = ["axum-core", "signed"] }
tower-sessions-core = "0.14"
openidconnect   = "3"
jsonwebtoken    = "9"
rand            = "0.8"
base64          = "0.22"
url             = "2"
time            = "0.3"

# (added later when wired up)
# rmcp = "0.2"
# fastembed = "4"

[features]
default  = []
# Compiles in AuthMode::Dev + the dev-injection middleware module.
# Production builds MUST omit this flag — release binaries built with
# default features literally do not contain the bypass code.
dev-auth = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
