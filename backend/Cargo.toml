[package]
name = "delphi"
version = "0.0.1"
edition = "2021"
description = "Delphi: research-tool backend (axum + storage + agents)."
license = "MIT OR Apache-2.0"

[lib]
name = "delphi"
path = "src/lib.rs"

[[bin]]
name = "delphi"
path = "src/main.rs"

[dependencies]
# storage
# `kv-mem` enables the embedded in-memory engine for fast tests
# (`Surreal::<Any>::connect("memory")`). Production keeps connecting via
# `ws://`; the engine type is now resolved at runtime from the URL.
surrealdb = { version = "2", default-features = false, features = [
    "protocol-ws",
    "protocol-http",
    "kv-mem",
    "rustls",
] }

# http server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
async-trait = "0.1"
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# errors
thiserror = "1"
anyhow = "1"

# LLM agent framework (provider-agnostic)
rig-core = { version = "0.35", features = ["all"] }

# auth (BFF lives in front of the backend — Traefik + oauth2-proxy. The
# backend trusts proxy-injected `X-Auth-*` headers and does no token work
# itself. Future: add `jsonwebtoken` here if we move to in-backend JWT
# validation as a second `ClaimsExtractor` impl.)

# (added later when wired up)
# rmcp = "0.2"
# fastembed = "4"

[features]
default  = []
# Compiles in AuthMode::Dev + the dev-injection middleware module.
# Production builds MUST omit this flag — release binaries built with
# default features literally do not contain the bypass code.
dev-auth = []

[dev-dependencies]
# Drive the axum router in tests via `tower::ServiceExt::oneshot()` —
# in-process, no network, every middleware layer attached.
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
bytes            = "1"
# (surrealdb `kv-mem` engine is in [dependencies] above so prod builds also
#  link the runtime polymorphic `Any` engine; tests hit the in-memory variant
#  by URL alone.)

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
