[package]
name = "delphi"
version = "0.0.1"
edition = "2021"
description = "Delphi: research-tool backend (axum + storage + agents)."
license = "MIT OR Apache-2.0"

[lib]
name = "delphi"
path = "src/lib.rs"

[[bin]]
name = "delphi"
path = "src/main.rs"

[dependencies]
# storage
# `kv-mem` enables the embedded in-memory engine for fast tests
# (`Surreal::<Any>::connect("memory")`). Production keeps connecting via
# `ws://`; the engine type is now resolved at runtime from the URL.
surrealdb = { version = "2", default-features = false, features = [
    "protocol-ws",
    "protocol-http",
    "kv-mem",
    "rustls",
] }

# http server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
# `ReceiverStream` adapts the per-turn mpsc::Receiver into a
# `Stream<Item = Bytes>` that axum's `Body::from_stream` consumes.
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# errors
thiserror = "1"
anyhow = "1"

# LLM agent framework (provider-agnostic)
rig-core = { version = "0.35", features = ["all"] }

# auth: the BFF (Traefik + oauth2-proxy) hands the IdP-signed JWT to the
# backend as `Authorization: Bearer <jwt>`. `JwtClaimsExtractor` re-validates
# the signature in-process (HS512 in tier-1 dev/tests, JWKS-fetched in tier-2
# and prod) — see `auth/validator.rs`. The same `jsonwebtoken` crate also
# handles the dev injector's HS512 minting (`auth/dev.rs`).

# Source-adapter HTTP fetch + content hashing. The default reqwest TLS stack
# (native-tls) drags in OpenSSL; rustls keeps the build pure-Rust and matches
# what surrealdb already pulls in.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# JWT minting for the SurrealDB record-user session token. We hand the
# token to `db.authenticate(jwt)`; SurrealDB validates against the same
# secret/JWKS via `DEFINE ACCESS … TYPE RECORD WITH JWT`. HS512-mode
# only today; RS256 is a feature-flag away when we want upstream-IdP
# JWTs to flow straight through to the DB without re-signing.
jsonwebtoken = { version = "9", default-features = false }

# pdftotext bbox-layout extractor reads poppler's XHTML output.
quick-xml = { version = "0.36", features = ["serialize"] }

# `Bytes` is in our `ObjectStore` API to avoid copies when piping PDFs
# from `reqwest` through to disk.
bytes = "1"

# Regex driver for ingestion-metadata canonical_id pattern validation
# (the `canonical_id_pattern` knob in MetadataPolicy).
regex = "1"

# Magic-byte content-type sniffer for the ingestion v2 object validator.
# Lightweight, zero deps, pure-Rust.
infer = "0.16"

# Lock-free sharded map. The chat task registry maps TaskId →
# CancellationToken; per-request inserts/removes hit different shards,
# avoiding the global mutex we'd otherwise need around a HashMap.
dashmap = "6"

# ULIDs for chat task ids (client-generated, server-mirrored). Tiny
# (no extra deps beyond getrandom which we already pull in transitively).
ulid = "1"

# (added later when wired up)
# rmcp = "0.2"
# fastembed = "4"

[features]
default  = []
# Compiles in AuthMode::Dev + the dev-injection middleware module.
# Production builds MUST omit this flag — release binaries built with
# default features literally do not contain the bypass code.
dev-auth = []

[dev-dependencies]
# Drive the axum router in tests via `tower::ServiceExt::oneshot()` —
# in-process, no network, every middleware layer attached.
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
bytes            = "1"
tempfile         = "3"
# Local HTTP mock server for embedder tests — small and pure-Rust.
wiremock         = "0.6"
# (surrealdb `kv-mem` engine is in [dependencies] above so prod builds also
#  link the runtime polymorphic `Any` engine; tests hit the in-memory variant
#  by URL alone.)

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
